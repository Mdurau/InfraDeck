name: DockPulse CI/CD Pipeline

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- STAGE 1: LINT & TEST ---
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python for Backend Linting
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Linters
        run: pip install flake8

      - name: Run Backend Lint Check
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 ./backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Set up Node.js for Frontend Validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Next.js Lint Check
        run: |
          cd frontend
          npm run lint

  # --- STAGE 2: COMPILE & DOCKER BUILD ---
  # --- STAGE 2: COMPILE & DOCKER BUILD ---
  build-production-images:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: dockpulse-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Production Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: dockpulse-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max